---
- name: Check whether Docker and the compose plugin are already present
  ansible.builtin.command:
    cmd: docker compose version
  register: docker_probe
  changed_when: false
  failed_when: false

- name: Note what we found
  ansible.builtin.debug:
    msg: >-
      {{ 'Docker already present (' ~ docker_probe.stdout | trim ~ ') - skipping install.'
         if docker_probe.rc == 0
         else 'Docker not found - installing from the official apt repository.' }}

- name: Install Docker from the official repository
  when: docker_probe.rc != 0
  block:
    - name: Install base + Docker apt prerequisites
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - gnupg
        state: present
        update_cache: true
        cache_valid_time: 300

    - name: Ensure apt keyrings directory exists
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Remove any pre-existing Docker apt source
      ansible.builtin.file:
        path: /etc/apt/sources.list.d/docker.list
        state: absent

    - name: Add Docker's official GPG key
      ansible.builtin.get_url:
        url: "https://download.docker.com/linux/{{ ansible_distribution | lower }}/gpg"
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"

    - name: Add the Docker apt repository
      ansible.builtin.apt_repository:
        repo: >-
          deb [arch={{ 'amd64' if ansible_architecture == 'x86_64' else ansible_architecture }}
          signed-by=/etc/apt/keyrings/docker.asc]
          https://download.docker.com/linux/{{ ansible_distribution | lower }}
          {{ ansible_distribution_release }} stable
        state: present
        filename: docker

    - name: Install Docker Engine + Compose plugin
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: true
      register: docker_install
      until: docker_install is succeeded
      retries: 5
      delay: 9

- name: Install the packages the lab itself wants
  ansible.builtin.apt:
    name:
      - curl
      - vim
      - python3
    state: present
    update_cache: true
    cache_valid_time: 300

- name: Enable and start Docker
  ansible.builtin.systemd:
    name: docker
    state: started
    enabled: true

# Without the userland proxy, IDS alerts carry the attacker address, not the bridge gateway.
- name: Read any existing Docker daemon configuration
  ansible.builtin.slurp:
    src: /etc/docker/daemon.json
  register: docker_daemon_raw
  failed_when: false
  changed_when: false
  when: drone_lab_preserve_source_ip | bool

- name: Merge userland-proxy=false into the Docker daemon configuration
  ansible.builtin.copy:
    # Merge, do not overwrite: the host may carry other daemon settings.
    content: >-
      {{ ((docker_daemon_raw.content | default('') | b64decode | from_json)
          if (docker_daemon_raw.content is defined)
          else {})
         | combine({'userland-proxy': false}) | to_nice_json }}
    dest: /etc/docker/daemon.json
    owner: root
    group: root
    mode: "0644"
  when: drone_lab_preserve_source_ip | bool
  notify: Restart Docker

- name: Fail clearly if compose is still unavailable
  ansible.builtin.command:
    cmd: docker compose version
  register: docker_final
  changed_when: false
  failed_when: docker_final.rc != 0
